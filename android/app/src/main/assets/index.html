<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>研究生课程表与作业管理系统 · 交互原型 v0.1</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#ffffff; --line:#e5e7eb; --line2:#d1d5db;
    --tx:#1f2328; --tx2:#6b7280; --tx3:#9ca3af;
    --accent:#3b5bdb; --accent-soft:#eef2ff;
    --ok:#1d9e75; --warn:#b45309; --warn-bg:#fff7ed; --danger:#dc2626; --danger-bg:#fef2f2;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--tx);font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;padding:20px}
  .wrap{max-width:1480px;margin:0 auto}
  .topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .brand{font-size:17px;font-weight:600;margin-right:6px}
  .brand span{color:var(--tx3);font-weight:400;font-size:12px;margin-left:8px}
  select,input,textarea,button{font:inherit;color:var(--tx)}
  select,input,textarea{background:#fff;border:1px solid var(--line2);border-radius:8px;padding:6px 10px;outline:none}
  select:focus,input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,91,219,.12)}
  .btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer}
  .btn:hover{background:#f9fafb;border-color:var(--tx3)}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.pri:hover{background:#2f4bc0}
  .btn.sm{padding:4px 9px;font-size:12px;border-radius:6px}
  .spacer{flex:1}
  .notice{display:flex;align-items:center;gap:10px;background:var(--warn-bg);border:1px solid #fed7aa;color:#92400e;border-radius:10px;padding:9px 14px;margin-bottom:12px;font-size:13px;cursor:pointer}
  .notice .dot{width:8px;height:8px;border-radius:50%;background:#f59e0b;flex:none}
  .notice.ok{background:#ecfdf5;border-color:#a7f3d0;color:#065f46}
  .notice.ok .dot{background:#10b981}
  .main{display:grid;grid-template-columns:1fr 340px;gap:14px;align-items:start}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
  .weekbar{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
  .weekbar .t{font-size:15px;font-weight:600}
  .weekbar .sub{color:var(--tx3);font-size:12px}
  table.grid{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed}
  table.grid th,table.grid td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);vertical-align:top;padding:0}
  table.grid th:last-child,table.grid td:last-child{border-right:none}
  table.grid thead th{background:#fafbfc;font-weight:500;font-size:12px;padding:8px 6px;text-align:center;color:var(--tx2)}
  table.grid thead th.today{background:var(--accent-soft);color:var(--accent);font-weight:600}
  table.grid thead th .d{display:block;font-size:11px;color:var(--tx3);margin-top:2px;font-weight:400}
  td.timecell{width:96px;background:#fafbfc;text-align:center;padding:12px 4px;font-size:12px;color:var(--tx2)}
  td.timecell b{display:block;font-size:13px;color:var(--tx);font-weight:500}
  td.timecell i{display:block;font-style:normal;font-size:11px;color:var(--tx3);margin-top:2px}
  td.cell{height:104px;background:#fff}
  td.cell.today{background:#fbfcff}
  td.cell.cur{box-shadow:inset 0 0 0 2px var(--accent)}
  .cls{position:relative;border-left-width:3px;border-left-style:solid;border-radius:6px;padding:6px 8px;margin:5px;font-size:12px;line-height:1.45;cursor:pointer;overflow:hidden}
  .cls:hover{filter:brightness(.98)}
  .cls .nm{font-weight:600;font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cls .mt{color:var(--tx2);font-size:11px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cls .wk{position:absolute;right:5px;bottom:4px;font-size:10px;color:var(--tx3)}
  .badge{position:absolute;top:4px;right:4px;min-width:16px;height:16px;border-radius:8px;background:var(--danger);color:#fff;font-size:10px;line-height:16px;text-align:center;padding:0 4px}
  .flag{position:absolute;top:4px;left:5px;font-size:10px;color:var(--warn);font-weight:600}
  .ev{border:1px dashed var(--line2);border-radius:6px;padding:5px 8px;margin:5px;font-size:11.5px;color:var(--tx2);background:#fcfcfd;cursor:pointer}
  .ev b{color:var(--tx);font-weight:500;display:block}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:11.5px;color:var(--tx3)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
  .side .card{margin-bottom:12px}
  .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .hd h3{font-size:13.5px;font-weight:600}
  .hd .n{font-size:11.5px;color:var(--tx3)}
  .as{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:7px;background:#fff;cursor:pointer}
  .as:hover{border-color:var(--tx3);background:#fafbfc}
  .as .r1{display:flex;align-items:center;gap:6px}
  .as .cn{font-size:12px;font-weight:600}
  .as .tt{font-size:12.5px;margin:2px 0 3px}
  .as .r2{font-size:11px;color:var(--tx2);display:flex;gap:8px;flex-wrap:wrap}
  .pill{font-size:10px;padding:1px 6px;border-radius:20px;border:1px solid var(--line2);color:var(--tx2);flex:none}
  .pill.m{background:#eef2ff;border-color:#c7d2fe;color:#3730a3}
  .pill.p{border-style:dashed}
  .pill.d{background:var(--danger-bg);border-color:#fecaca;color:var(--danger)}
  .pill.g{background:#ecfdf5;border-color:#a7f3d0;color:#065f46}
  .pill.y{background:#fffbeb;border-color:#fde68a;color:#92400e}
  .cd{font-size:11px;color:var(--danger);font-weight:600;flex:none}
  .cd.far{color:var(--tx2);font-weight:400}
  .stat{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--line);font-size:12px}
  .stat:last-child{border:none}
  .stat b{font-weight:600}
  .seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
  .seg button{border:none;background:#fff;padding:6px 14px;cursor:pointer;font-size:13px;color:var(--tx2)}
  .seg button.on{background:var(--accent);color:#fff}
  .pcard{border:1px solid var(--line);border-left:3px solid var(--tx3);border-radius:6px;padding:5px 7px;margin:4px 0;font-size:11.5px;cursor:pointer;background:#fff;position:relative}
  .pcard:hover{background:#fafbfc}
  .pcard .nm{font-weight:600;font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:34px}
  .pcard .mt{color:var(--tx2);font-size:10.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pcard.sel{border-color:var(--accent);border-left-color:var(--accent);background:#f5f8ff}
  .pcard.out{opacity:.45}
  .pcard.out .nm{text-decoration:line-through}
  .pcard .chip{position:absolute;right:5px;top:4px;font-size:9.5px;padding:0 5px;border-radius:4px;background:#f3f4f6;color:var(--tx2)}
  .pcard.sel .chip{background:var(--accent);color:#fff}
  .pcard.out .chip{background:#f3f4f6;color:var(--tx3)}
  .cgrp{border:1px dashed #f0a3a3;background:#fff8f8;border-radius:8px;margin:5px 3px;padding:4px}
  .cgrp .gh{font-size:10.5px;color:#b91c1c;font-weight:600;padding:1px 4px 3px;display:flex;justify-content:space-between;align-items:center}
  .cgrp .pcard{margin:3px 0;border-left-color:var(--danger);border-color:#fecaca}
  /* 逐格选课：每个时段一个下拉框，选一门或「无课」 */
  .slotpick{display:flex;flex-direction:column;gap:3px;margin:2px 0}
  .slotpick select{width:100%;font-size:11px;padding:3px 4px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--tx);cursor:pointer}
  .slotpick select:focus{outline:2px solid var(--accent);outline-offset:-1px}
  .slc{font-size:10px;color:var(--tx3);display:flex;justify-content:space-between;align-items:center;gap:4px}
  .slc button{border:1px solid var(--line);background:#fff;border-radius:4px;font-size:10px;padding:0 5px;cursor:pointer;color:var(--tx2)}
  .slc button:hover{border-color:var(--accent);color:var(--accent)}
  .slotempty{text-align:center;color:var(--tx3);font-size:11px;padding:8px 0}
  .slout{font-size:10px;color:var(--tx3);margin-top:2px}
  table.grid.plan td.cell{height:auto;min-height:116px;padding:1px}
  .grpline{border:1px solid #fecaca;background:#fff8f8;border-radius:8px;padding:7px 9px;margin-bottom:7px;font-size:12px}
  .grpline .gt{font-size:11px;color:#b91c1c;font-weight:600;margin-bottom:3px}
  .grpline .gc{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
  .grpline .gc span{font-size:11px;padding:1px 6px;border-radius:5px;background:#fff;border:1px solid #fecaca;color:#991b1b}
  .grpline .gc span.sel{background:var(--accent);border-color:var(--accent);color:#fff}
  .grpline .gc span.out{opacity:.45;text-decoration:line-through}
  .noft{border:1px dashed var(--line2);border-radius:8px;padding:7px 9px;margin-bottom:7px;font-size:11.5px;color:var(--tx2);background:#fcfcfd}
  .ov{position:fixed;inset:0;background:rgba(17,24,39,.45);display:none;padding:40px 16px;z-index:50;overflow:auto}
  .ov.on{display:block}
  .modal{background:#fff;border-radius:14px;max-width:820px;margin:0 auto;padding:20px;max-height:calc(100vh - 80px);overflow:auto}
  .modal h2{font-size:16px;font-weight:600;margin-bottom:4px}
  .modal .desc{color:var(--tx2);font-size:12.5px;margin-bottom:14px}
  .modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
  table.tb{width:100%;border-collapse:collapse;font-size:12.5px}
  table.tb th,table.tb td{border:1px solid var(--line);padding:6px 8px;text-align:left}
  table.tb th{background:#fafbfc;font-weight:500;color:var(--tx2);white-space:nowrap}
  .map{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
  .map .row{display:flex;align-items:center;gap:8px;font-size:12px}
  .map .row .k{width:88px;color:var(--tx2);flex:none}
  .map .row select{flex:1;font-size:12px;padding:4px 8px}
  .form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .form label{font-size:12px;color:var(--tx2);display:block;margin-bottom:3px}
  .form .full{grid-column:1/-1}
  .form select,.form input,.form textarea{width:100%}
  .kv{display:grid;grid-template-columns:96px 1fr;gap:6px 12px;font-size:13px;margin-bottom:14px}
  .kv .k{color:var(--tx2)}
  .sec{font-size:12px;color:var(--tx3);margin:14px 0 6px;font-weight:600;letter-spacing:.3px}
  .diff{display:flex;align-items:center;gap:10px;font-size:13px}
  .diff .o{color:var(--tx3);text-decoration:line-through}
  .diff .n{color:var(--danger);font-weight:600}
  .tag{font-size:11px;padding:1px 7px;border-radius:5px;background:#f3f4f6;color:var(--tx2);border:1px solid var(--line)}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#111827;color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;display:none;z-index:99}
  .empty{color:var(--tx3);font-size:12px;text-align:center;padding:18px 0}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  @media (max-width:1180px){.main{grid-template-columns:1fr}.form,.map{grid-template-columns:1fr}}

  /* ===== 学习计划 ===== */
  .mini{font-size:10.5px;color:var(--tx2);background:#f3f4f6;border:1px solid var(--line);border-radius:4px;padding:2px 6px;margin:4px 2px 0;display:inline-block;line-height:1.6}
  .mini.on{background:var(--accent-soft);border-color:#c7d2fe;color:#3730a3}
  .mini.off{opacity:.5;text-decoration:line-through}
  .pl{display:block;width:100%;text-align:left;border:1px solid #c7d2fe;background:var(--accent-soft);color:#3730a3;border-radius:6px;padding:5px 8px;margin:4px 2px 0;font-size:11.5px;cursor:pointer;line-height:1.55}
  .pl:hover{background:#e0e7ff}
  .pl.done{background:#f9fafb;border-color:var(--line);color:var(--tx3)}
  .pl.done .pt{text-decoration:line-through}
  .pl.warn{border-color:#fcd34d;background:var(--warn-bg);color:var(--warn)}
  .pl .mi{opacity:.8;font-size:10.5px}
  .pl .x{float:right;color:var(--tx3);font-weight:700;padding:0 2px}
  .pl .x:hover{color:var(--danger)}
  .addpl{display:block;width:100%;margin-top:6px;border:1px dashed var(--line2);background:transparent;color:var(--tx3);border-radius:6px;padding:4px;font-size:11px;cursor:pointer}
  .addpl:hover{border-color:var(--accent);color:var(--accent)}

  /* ===== 作业待办清单 ===== */
  .tdo{margin-top:6px;border-top:1px dashed var(--line);padding-top:8px}
  .tdo .it{display:flex;align-items:center;gap:7px;font-size:12.5px;padding:4px 0}
  .tdo .it span{flex:1;line-height:1.5}
  .tdo .it.done span{text-decoration:line-through;color:var(--tx3)}
  .tdo .del{color:var(--tx3);cursor:pointer;font-size:14px;padding:0 3px;flex:none}
  .tdo .del:hover{color:var(--danger)}
  .tdo .addrow{display:flex;gap:6px;margin-top:6px}
  .tdo .addrow input{flex:1;font-size:12.5px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;font-family:inherit}
  .tprog{font-size:11px;color:var(--tx2);font-weight:600}
  .tprog.ok{color:var(--ok)}
  .attpill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;background:#f3f4f6;border:1px solid var(--line);color:var(--tx2)}
  .attpill.set{background:var(--accent-soft);border-color:#c7d2fe;color:#3730a3}

  html{-webkit-text-size-adjust:100%}
  body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
  .gridwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .appmore{position:fixed;right:14px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:45;display:none}
  @media (max-width:900px){
    body{padding:0 0 24px}
    .wrap{max-width:100%}
    .topbar{position:sticky;top:0;z-index:40;background:var(--bg);margin:0 0 10px;padding:10px 12px;gap:8px;
      padding-top:calc(8px + env(safe-area-inset-top));border-bottom:1px solid var(--line)}
    .brand{font-size:15px;flex:1 1 100%;margin:0}
    .brand span{display:none}
    #semSel{flex:1 1 130px;min-width:110px;font-size:12px;padding:7px 8px}
    .seg button{padding:8px 12px;font-size:13px}
    .main{grid-template-columns:1fr;gap:10px;padding:0 10px}
    .card{padding:11px;border-radius:10px}
    .side .card{margin-bottom:10px}
    table.grid{min-width:640px}
    td.timecell{width:54px;padding:8px 2px;font-size:11px}
    td.timecell i{display:none}
    td.timecell b{font-size:11.5px}
    td.cell{height:86px}
    table.grid.plan td.cell{min-height:96px}
    .cls{font-size:11px;padding:4px 6px;margin:3px;border-radius:5px}
    .cls .nm{font-size:11.5px}
    .cls .mt{font-size:10px}
    .cls .wk{font-size:9px;right:3px;bottom:2px}
    .badge{top:2px;right:2px;min-width:15px;height:15px;line-height:15px;font-size:9px}
    .pcard .nm{font-size:11.5px;padding-right:30px}
    .pcard .mt{font-size:10px}
    .weekbar{gap:6px}
    .weekbar .t{font-size:14px}
    .weekbar .sub{font-size:11px}
    .btn{padding:9px 12px}
    .btn.sm{padding:6px 10px;font-size:12px}
    .notice{font-size:12px;padding:9px 11px;align-items:flex-start;margin:0 10px 10px}
    .legend{gap:8px;font-size:10.5px}
    .as{padding:9px 10px}
    .ov{display:none;padding:0;align-items:flex-end}
    .ov.on{display:flex}
    .modal{width:100%;max-width:none;border-radius:16px 16px 0 0;margin:0;max-height:86vh;
      padding:14px 14px calc(16px + env(safe-area-inset-bottom));overflow:auto}
    .modal h2{font-size:15px}
    .modal .desc{font-size:12px}
    .form,.map{grid-template-columns:1fr}
    .kv{grid-template-columns:74px 1fr}
    .toast{bottom:calc(24px + env(safe-area-inset-bottom))}
    table.tb{font-size:11.5px}
    table.tb th,table.tb td{padding:5px 6px}
    .appmore{display:block}
  }

</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">研究生课程表与作业管理<span>交互原型 v0.1</span></div>
    <select id="semSel"><option>2026–2027 学年 · 秋季学期</option><option>2025–2026 学年 · 春季学期（归档）</option></select>
    <div class="seg" id="modeSeg">
      <button class="on" data-m="term">学期课表</button>
      <button data-m="study">学习计划</button>
      <button data-m="plan">选课模式</button>
    </div>
    <div class="spacer"></div>
    <span id="btnTerm">
      <button class="btn" id="btnExcel">导入 Excel 课表</button>
      <button class="btn" id="btnOcr">截图识别变更</button>
      <button class="btn pri" id="btnNew">+ 新建作业</button>
    </span>
    <span id="btnStudy" style="display:none">
      <button class="btn" id="btnCopyWeek">复制上周计划</button>
      <button class="btn" id="btnClearWeek">清空本周</button>
      <button class="btn pri" id="btnAddPlan">+ 添加计划</button>
    </span>
    <span id="btnPlan" style="display:none">
      <button class="btn" id="btnPlanImp">导入选课清单</button>
      <button class="btn" id="btnClearSel">清空选择</button>
      <button class="btn pri" id="btnExport">导出为正式课表</button>
    </span>
  </div>

  <div class="notice" id="changeBar"><span class="dot"></span><span id="changeTxt"></span><span class="spacer"></span><span style="font-size:12px;opacity:.8">点击处理 →</span></div>

  <div class="main">
    <section class="card">
      <div class="weekbar" id="planbar" style="display:none">
        <div><span class="t">逐格选课</span> <span class="sub">每个格子选一门课，或选「无课」；冲突的课会自动排除</span></div>
        <div class="spacer"></div>
        <span class="sub" id="pStat"></span>
      </div>
      <div class="weekbar" id="studybar" style="display:none">
        <div><span class="t">本周学习计划</span> <span class="sub">按格子安排：没课的时段直接学；有课的时段可安排「上课时学别的」，会标黄提醒</span></div>
        <div class="spacer"></div>
        <span class="sub" id="sStat2"></span>
      </div>
      <div class="weekbar" id="weekbar">
        <button class="btn sm" id="prevW">← 上一周</button>
        <div><span class="t" id="wTitle">第 1 周</span> <span class="sub" id="wRange"></span></div>
        <button class="btn sm" id="nextW">下一周 →</button>
        <button class="btn sm" id="todayW">回到本周</button>
        <div class="spacer"></div>
        <span class="sub" id="wStat"></span>
      </div>
      <table class="grid" id="grid"></table>
      <div id="termEmpty"></div>
      <div id="pendingBox"></div>
      <div class="legend">
        <span><i style="background:#dc2626"></i>角标 = 待办作业数</span>
        <span><i style="background:#f59e0b"></i>左侧标记 = 存在待确认变更</span>
        <span><i style="background:#9ca3af;border:1px dashed #6b7280"></i>虚线 = 组会 / 讲座等非课程事件</span>
        <span>灰显 = 本周不上（周次不匹配）</span>
      </div>
    </section>

    <aside class="side">
      <div id="sideTerm">
        <div class="card">
          <div class="hd"><h3>本周作业</h3><span class="n" id="asCount"></span></div>
          <div id="asList"></div>
        </div>
        <div class="card">
          <div class="hd"><h3>本周概览</h3></div>
          <div id="stats"></div>
        </div>
      </div>
      <div id="sideStudy" style="display:none">
        <div class="card">
          <div class="hd"><h3>本周计划概览</h3></div>
          <div id="sStats"></div>

function countdown(s){const d=parseDue(s),ms=d-NOW;if(ms<0)return{t:'已逾期',c:'d'};
  const h=ms/36e5;if(h<24)return{t:Math.round(h)+' 小时后',c:'d'};
  const dd=Math.floor(h/24);return{t:dd+' 天后',c:dd<=1?'d':'far'}}

/* ============ 与教务排课表核对 ============ */
function normName(s){let x=String(s);
  x=x.replace(/[（(]\s*0*(\d+)\s*班\s*[）)]/g,'$1班').replace(/[-–—]\s*0*(\d+)\s*班/g,'$1班');
  x=x.replace(/\s+/g,'').replace(/[^\u4e00-\u9fa5A-Za-z0-9]/g,'').replace(/0+(\d)/g,'$1');return x}
function normRoom(s){return String(s).replace(/\s+/g,'').replace(/[、,，/]/g,'|').replace(/\|+/g,'|').replace(/^\||\|$/g,'')}
function officialOf(name){const n=normName(name);
  return planCourses.find(p=>{const pn=normName(p.name);return pn&&(pn===n||pn.includes(n)||n.includes(pn))})}
function checkMismatch(){
  const out=[];
  slots.forEach(s=>{
    const c=course(s.c),o=officialOf(c.name);
    if(!o)return;
    const mine=normRoom(s.r),of=normRoom(o.room);
    if(!of)return;
    if(mine!==of&&!mine.includes(of)&&!of.includes(mine))
      out.push({slot:s,course:c,mine:s.r,official:o.room,note:o.note});
  });
  return out;
}

/* ============ 选课模式：冲突检测 ============ */
function toMin(s){const p=s.split(':');return (+p[0])*60+(+p[1])}
function tOverlap(a,b){if(a.d!==b.d)return false;return toMin(a.start)<toMin(b.end)&&toMin(b.start)<toMin(a.end)}
function wOverlap(a,b){return a.weeks.some(w=>b.weeks.includes(w))}
function periodsOf(t){const s=toMin(t.start),e=toMin(t.end);
  return Object.keys(PIV).filter(k=>s<PIV[k][1]&&PIV[k][0]<e)}
function winText(a,b){return `${DAYS[a.d]} ${toMin(a.start)<toMin(b.start)?a.start:b.start}–${toMin(a.end)>toMin(b.end)?a.end:b.end}`}
function analyze(){
  const sess=[];planCourses.forEach(c=>c.times.forEach((t,i)=>sess.push({key:c.id+'#'+i,cid:c.id,t:t,c:c})));
  const par={};sess.forEach(s=>par[s.key]=s.key);
  const find=x=>{while(par[x]!==x){par[x]=par[par[x]];x=par[x]}return x};
  const uni=(a,b)=>{a=find(a);b=find(b);if(a!==b)par[b]=a};
  const near=[];
  for(let i=0;i<sess.length;i++)for(let j=i+1;j<sess.length;j++){
    const A=sess[i],B=sess[j];
    if(A.cid===B.cid)continue;
    if(tOverlap(A.t,B.t)){ if(wOverlap(A.t,B.t))uni(A.key,B.key); else near.push([A,B]); }
  }
  const buckets={};sess.forEach(s=>{const r=find(s.key);(buckets[r]=buckets[r]||[]).push(s)});
  const gid={};const groups=[];let n=0;
  Object.values(buckets).forEach(g=>{ if(g.length>1){const id='G'+(++n);g.forEach(s=>gid[s.key]=id);groups.push({id:id,sess:g})} });
  return {sess:sess,gid:gid,groups:groups,near:near};
}

  html+='</tbody>';
  document.getElementById('grid').innerHTML=html;

  const none=planCourses.filter(c=>c.times.every(t=>periodsOf(t).length===0));
  if(none.length)toast(`${none.length} 门课程时段未匹配，已置入未归类：${none.map(c=>c.name).join('、')}`);

  const sel=planCourses.filter(c=>c.status==='已选'),out=planCourses.filter(c=>c.status==='排除');
  const cand=planCourses.filter(c=>c.status==='候选');
  document.getElementById('pStat').textContent=`候选 ${cand.length} · 已选 ${sel.length} · 排除 ${out.length}`;
  document.getElementById('pStats').innerHTML=`
    <div class="stat"><span>清单课程总数</span><b>${planCourses.length} 门</b></div>
    <div class="stat"><span>已选</span><b>${sel.length} 门 / ${sel.reduce((s,c)=>s+c.credit,0)} 学分</b></div>
    <div class="stat"><span>候选待定</span><b>${cand.length} 门</b></div>
    <div class="stat"><span>已排除</span><b>${out.length} 门</b></div>
    <div class="stat"><span>冲突组</span><b><span style="color:#b91c1c">${A.groups.length} 组</span></b></div>`;

  document.getElementById('pGrpN').textContent=`${A.groups.length} 组`;
  document.getElementById('pGroups').innerHTML=A.groups.length?A.groups.map(g=>{
    const cs=[...new Set(g.sess.map(s=>s.cid))].map(id=>planCourses.find(c=>c.id===id));
    const w=winText(g.sess[0].t,g.sess[1].t);
    const weeks=g.sess.map(s=>s.t.wk).filter((v,i,a)=>a.indexOf(v)===i).join(' ∩ ');
    return `<div class="grpline"><div class="gt">${g.id} · ${w} · ${weeks}</div>
      <div style="color:#7f1d1d">共 ${cs.length} 门互斥，只能选其一</div>
      <div class="gc">${cs.map(c=>`<span class="${c.status==='已选'?'sel':c.status==='排除'?'out':''}" onclick="openPlan('${c.id}')">${c.name}</span>`).join('')}</div></div>`;
  }).join(''):'<div class="empty">当前清单没有时间冲突</div>';

  const pendP=planCourses.filter(c=>!c.times.length);
  document.getElementById('pPendN').textContent=pendP.length+' 门';

      <button class="btn sm${c.status==='已选'?'':' pri'}" onclick="togglePlan('${c.id}')">${c.status==='已选'?'取消':'选这门'}</button>

    `<div class="noft">${a.c.name} × ${b.c.name}<br><span style="color:var(--tx3)">时间重叠 ${a.t.start}–${a.t.end}，但周次 ${a.t.wk} 与 ${b.t.wk} 无交集 → 可同时选</span></div>`).join('')
    :'<div class="empty">暂无周次错开的课程对</div>';

/* ---------- 逐格选课 ---------- */
/* 在某个格子里选课：cid 为空 = 该时段设为「无课」 */
function pick(d,p,cid){
  const A=analyze();
  const here=A.sess.filter(s=>s.t.d===d&&periodsOf(s.t).includes(p.k||p));
  if(!cid){
    const drop=here.filter(s=>s.c.status==='已选');
    drop.forEach(s=>{s.c.status='候选'});
    render();
    if(drop.length)toast('该时段已设为无课：'+drop.map(s=>s.c.name).join('、'));
    return;
  }
  setPlan(cid,'已选');
}
/* 某格子里的全部候选（用于同时段不冲突、想多选的情况） */
function openCell(d,p){
  const A=analyze();
  const here=A.sess.filter(s=>s.t.d===d&&periodsOf(s.t).includes(p));
  const pn=PERIODS.find(x=>x.k===p);
  const rows=here.map(s=>{
    const c=s.c,st=c.status;
    const btn=st==='已选'?`<button class="btn sm" onclick="togglePlan('${c.id}')">取消选择</button>`
      :st==='排除'?`<button class="btn sm" onclick="togglePlan('${c.id}')">改为候选</button>`
      :`<button class="btn sm pri" onclick="togglePlan('${c.id}')">选这门</button>`;
    return `<div class="grpline" style="margin:6px 0">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start">
        <div style="flex:1">
          <b>${c.name}</b> ${st==='已选'?'<span class="pill g">已选</span>':st==='排除'?'<span class="pill">已排除</span>':''}<br>
          <span style="color:var(--tx2);font-size:12px">${s.t.start}-${s.t.end} · ${s.t.wk} · ${c.teacher} · ${c.credit}学分 · ${c.room||'—'}</span>
          ${A.gid[s.key]?`<br><span style="color:#b91c1c;font-size:11.5px">冲突组 ${A.gid[s.key]}：与同组课程互斥</span>`:''}
        </div>
        <div style="white-space:nowrap">${btn}</div>
      </div></div>`;
  }).join('');
  open(`<h2>${DAYS[d]} ${pn?pn.n:''}</h2>
  <div class="desc">该时段共 <b>${here.length}</b> 门课。下拉框只能选一门；若两门课周次不重叠（如同为周三下午但一个单周、一个双周），可在下面分别点选。</div>
  ${rows}
  <div class="foot"><button class="btn" onclick="closeM()">关闭</button>
  <button class="btn" onclick="pick(${d},'${p}','')">该时段设为无课</button></div>`);
}
function togglePlan(id){
  const c=planCourses.find(x=>x.id===id);
  if(!c)return;
  if(c.status==='已选'){c.status='候选';closeM();render();toast('已取消：'+c.name)}
  else setPlan(id,'已选');
}
function pcard(s,A){
  const c=s.c,st=c.status==='已选'?'sel':c.status==='排除'?'out':'';
  const chip=c.status==='已选'?'已选':c.status==='排除'?'排除':'候选';
  return `<div class="pcard ${st}" onclick="openPlan('${c.id}')">
    <span class="chip">${chip}</span>
    <span class="nm">${c.name}</span>
    <span class="mt">${s.t.start}-${s.t.end} · ${c.teacher} · ${c.credit}学分 · ${c.cat}</span>
    <span class="mt" style="color:var(--tx3)">${c.room||''} ${s.t.wk}</span></div>`;
}
function openPlan(id){
  const c=planCourses.find(x=>x.id===id),A=analyze();
  const mySess=A.sess.filter(s=>s.cid===id);
  const gids=[...new Set(mySess.map(s=>A.gid[s.key]).filter(Boolean))];
  const blocks=[];
  gids.forEach(g=>{
    const gobj=A.groups.find(x=>x.id===g);
    blocks.push(`<div class="grpline"><div class="gt">${g} · 与下列课程互斥</div>
      ${[...new Set(gobj.sess.filter(s=>s.cid!==id).map(s=>s.cid))].map(cid=>{
        const o=planCourses.find(x=>x.id===cid),os=gobj.sess.find(s=>s.cid===cid);
        return `<div style="font-size:12px">· ${o.name}（${o.teacher}）— 重叠 ${winText(mySess[0].t,os.t)}，${os.t.wk}</div>`}).join('')}</div>`);
  });

    · 周次写法：<b>1-16周</b> / <b>9-16</b> / <b>单周</b> / <b>双周</b>，缺省按 1-18 周<br>
    · 冲突判定：同一天时间区间相交 <b>且</b> 周次有交集，才计为冲突

function doPlanImport(){
  const text=document.getElementById('pin').value;const out=[];let n=0;
  const DM={'一':0,'二':1,'三':2,'四':3,'五':4,'六':5,'日':6,'天':6};
  const PM={morning:['08:30','11:30'],afternoon:['14:00','17:00'],evening:['18:00','21:00']};
  text.split(/\n+/).forEach(line=>{
    line=line.trim();if(!line||line.startsWith('#'))return;
    const p=line.split(/[|\t]|\s{2,}/).map(s=>s.trim()).filter(Boolean);
    if(p.length<2)return;
    const name=p[0];let code='',teacher='',room='',weeks=range(1,18),wk='1-18周',credit=2,timeStr='';
    p.slice(1).forEach(x=>{
      if(/周[一二三四五六日天]/.test(x)&&!timeStr)timeStr=x;
      else if(/^[A-Za-z]{2}\d{3,4}$/.test(x))code=x;
      else if(/^(第)?\d+\s*[-~至]\s*\d+\s*周?$/.test(x)||/单周|双周/.test(x)){
        const m=x.match(/(\d+)\s*[-~至]\s*(\d+)/);
        if(m){weeks=range(+m[1],+m[2]);wk=`${m[1]}-${m[2]}周`}
        else if(x.includes('单')){weeks=odd(1,17);wk='单周'}else{weeks=even(2,18);wk='双周'}
      }
      else if(/^\d+(\.\d)?$/.test(x))credit=+x;
      else if(!teacher&&/^[\u4e00-\u9fa5A-Za-z.\s]{1,12}$/.test(x)&&!/(楼|厅|室|线上|腾讯|zoom|Zoom)/.test(x))teacher=x;
      else if(!room)room=x;
    });
    const times=[];
    const re=/(?:周|星期)([一二三四五六日天])\s*(上午|下午|晚上|(\d{1,2}:\d{2})\s*[-~至到]\s*(\d{1,2}:\d{2}))/g;
    let m;while((m=re.exec(timeStr))){
      const d=DM[m[1]];
      let s,e;
      if(m[2]==='上午')[s,e]=PM.morning;else if(m[2]==='下午')[s,e]=PM.afternoon;
      else if(m[2]==='晚上')[s,e]=PM.evening;else{s=m[3];e=m[4]}
      times.push(T(d,s,e,weeks,wk));
    }
    if(!times.length)return;
    out.push({id:'p'+(++n),code:code||'—',name:name,teacher:teacher||'—',credit:credit,cat:'候选课程',status:'候选',times:times,room:room||'—'});
  });
  if(!out.length)return toast('未能解析出课程，请检查是否包含课程名与上课时间');
  planCourses=out;closeM();render();toast(`已导入 ${out.length} 门课程，正在检测时间冲突…`);
}

function plansAt(w,d,p){return plans.filter(x=>x.week===w&&x.d===d&&x.p===p)}

function attText(c){return c&&c.attendance&&c.attendance!=='（未填写）'?c.attendance:''}

function renderStudy(){
  const dates=weekDates(W), isCur=(W===curWeek()), todayIdx=(NOW.getDay()+6)%7;
  document.getElementById('wTitle').textContent=`第 ${W} 周 · 学习计划`;
  document.getElementById('wRange').textContent=`${dates[0]} — ${dates[6]}${isCur?' · 本周':''}`;
  let html='<thead><tr><th style="width:96px">时间</th>';
  DAYS.forEach((d,i)=>{const t=isCur&&i===todayIdx;html+=`<th class="${t?'today':''}">${d}<span class="d">${dates[i]}</span></th>`});
  html+='</tr></thead><tbody>';
  let total=0,done=0,warn=0,free=[];
  PERIODS.forEach(p=>{
    html+=`<tr><td class="timecell"><b>${p.n}</b><i>${p.t}</i></td>`;
    for(let i=0;i<7;i++){
      const isToday=isCur&&i===todayIdx;
      html+=`<td class="cell ${isToday?'today':''}">`;
      const cs=classesAt(W,i,p.k);

        cs.forEach(s=>{

        });
      }else{
        // 本周不上：可能是单/双周或周次区间
        const maybe=slots.filter(s=>s.d===i&&s.p===p.k&&!s.weeks.includes(W));
        if(maybe.length){
          html+=`<span class="mini off" title="本周不上">${maybe.map(s=>course(s.c).name).join('、')}（本周不上${maybe[0].w?' · '+maybe[0].w:''}）</span>`;
        }
      }
      const ps=plansAt(W,i,p.k);
      ps.forEach(pl=>{
        total++; if(pl.done)done++; if(pl.clash)warn++;
        const cn=pl.cid?course(pl.cid):null;
        html+=`<div class="pl ${pl.done?'done':''} ${pl.clash?'warn':''}" onclick="togglePlanDone('${pl.id}')">

      });
      html+=`<button class="addpl" onclick="openPlanAdd(${i},'${p.k}')">+ 添加计划</button>`;
      if(!cs.length&&!ps.length)free.push(`${DAYS[i]}${p.n}`);
      html+='</td>';
    }
    html+='</tr>';
  });
  html+='</tbody>';
  document.getElementById('grid').innerHTML=html;
  document.getElementById('grid').className='grid';
  document.getElementById('termEmpty').innerHTML='';
  document.getElementById('pendingBox').innerHTML='';

  const mins=plans.filter(x=>x.week===W&&!x.done).reduce((s,x)=>s+(+x.minutes||0),0);
  document.getElementById('wStat').textContent=`本周 ${total} 条计划 · 已完成 ${done}`;
  document.getElementById('sStat2').textContent=`未完成预计 ${(mins/60).toFixed(1)} 小时`;
  document.getElementById('sStats').innerHTML=`
    <div class="stat"><span>计划条目</span><b>${total} 条</b></div>
    <div class="stat"><span>已完成</span><b>${done} 条</b></div>
    <div class="stat"><span>未完成预计</span><b>${(mins/60).toFixed(1)} 小时</b></div>
    <div class="stat"><span>上课时学别的</span><b>${warn} 条</b></div>
    <div class="stat"><span>空闲时段</span><b>${free.length} 个</b></div>`;

  const wl=plans.filter(x=>x.week===W&&x.clash);
  document.getElementById('sWarnN').textContent=wl.length?`${wl.length} 条`:'';
  document.getElementById('sWarn').innerHTML=wl.length?wl.map(x=>
    `<div class="noft"><b>${x.title}</b><br><span style="color:var(--tx3)">${DAYS[x.d]} ${PERIODS.find(p=>p.k===x.p).n} · 该时段有课${x.cid?'（'+course(x.cid).name+'）':''}${x.minutes?' · '+x.minutes+' 分钟':''}</span></div>`).join('')
    :'<div class="empty">暂无。在有课的格子里添加计划会自动标黄</div>';

  document.getElementById('sFreeN').textContent=free.length?`${free.length} 个`:'';
  document.getElementById('sFree').innerHTML=free.length?`<div style="font-size:12.5px;color:var(--tx2);line-height:2">${free.map(f=>`<span class="tag" style="margin:0 4px 4px 0">${f}</span>`).join('')}</div><div style="color:var(--tx3);font-size:11.5px;margin-top:6px">这些格子本周既没课也没安排，可用来补进度</div>`:'<div class="empty">本周每个时段都有安排了</div>';

  const as=assigns.filter(a=>a.week===W&&a.status!=='已提交'&&a.status!=='已批改');
  document.getElementById('sAsN').textContent=as.length?`${as.length} 条`:'';
  document.getElementById('sAs').innerHTML=as.length?as.map(a=>{
    const c=course(a.c),pr=a.todos&&a.todos.length?a.todos.filter(t=>t.done).length:0;
    return `<div class="noft" style="cursor:pointer" onclick="openAs('${a.id}')"><b>${a.title}</b>
      ${a.todos&&a.todos.length?`<span class="tprog ${pr===a.todos.length?'ok':''}" style="float:right">${pr}/${a.todos.length}</span>`:''}
      <br><span style="color:var(--tx3)">${c.name} · 截止 ${a.due}</span></div>`}).join(''):'<div class="empty">本周没有待办作业</div>';
}

<script>
(function(){
/* ============ 网格横向滚动容器 ============ */
var gEl=document.getElementById('grid');
if(gEl && gEl.parentNode.className.indexOf('gridwrap')<0){
  var wrap=document.createElement('div'); wrap.className='gridwrap';
  gEl.parentNode.insertBefore(wrap,gEl); wrap.appendChild(gEl);
}

/* ============ 本地持久化 ============ */
var KEY='gs_data_v1';
/* 优先走原生 SharedPreferences（file:// 下 localStorage 可能不可用），失败降级 localStorage */
function nsGet(){
  try{ if(window.Android&&window.Android.loadData){ var s=window.Android.loadData(); if(s) return s; } }catch(e){}
  try{ return localStorage.getItem(KEY); }catch(e){}
  return null;
}
function nsSet(v){
  try{ if(window.Android&&window.Android.saveData){ window.Android.saveData(v); return true; } }catch(e){}
  try{ localStorage.setItem(KEY,v); return true; }catch(e){}
  return false;
}
function nsClear(){
  try{ if(window.Android&&window.Android.saveData){ window.Android.saveData(''); } }catch(e){}
  try{ localStorage.removeItem(KEY); }catch(e){}
}
function put(t,s){ if(!s||!s.length) return; t.length=0; for(var i=0;i<s.length;i++) t.push(s[i]); }
function persist(){
  try{ nsSet(JSON.stringify({
    courses:courses, slots:slots, events:events, assigns:assigns,
    changes:changes, planCourses:planCourses, plans:plans, W:W })); }catch(e){}
}
function restore(){
  var raw=null; try{ raw=nsGet(); }catch(e){}
  if(!raw) return false;
  try{
    var d=JSON.parse(raw);
    put(courses,d.courses); put(slots,d.slots); put(events,d.events); put(planCourses,d.planCourses);
    if(d.assigns) assigns=d.assigns;
    if(d.changes) changes=d.changes;
    if(d.plans) plans=d.plans;
    if(typeof d.W==='number') W=d.W;
    return true;
  }catch(e){ return false; }
}
var _had=restore();
var _render=render;
render=function(){ try{persist();}catch(e){} return _render.apply(this,arguments); };

/* ============ 工具 ============ */
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function pd(n){ n=String(n); return n.length<2?'0'+n:n; }
function perOf(start){ var h=parseInt(String(start).slice(0,2),10); return h<12?'morning':(h<18?'afternoon':'evening'); }

/* ============ Excel 解析 ============ */
var PM={'上午':['08:30','11:30'],'下午':['14:00','17:00'],'晚上':['18:00','21:00']};
var DAYMAP={'一':0,'二':1,'三':2,'四':3,'五':4,'六':5,'日':6,'天':6};
var DAYLBL=['周一','周二','周三','周四','周五','周六','周日'];

function cv(r,c){ if(c==null||r==null) return ''; var v=r[c]; return v==null?'':String(v).replace(/\s+/g,' ').trim(); }
function findHeader(rows){
  for(var i=0;i<Math.min(rows.length,25);i++){
    var r=rows[i]||[], ne=0, hit=false;
    for(var c=0;c<r.length;c++){ var s=cv(r,c); if(s) ne++; if(/课程名称|课程名/.test(s)) hit=true; }
    if(hit && ne>=3) return i;
  }
  return -1;
}
function findDayRow(rows,hdr){
  for(var i=hdr;i<Math.min(hdr+3,rows.length);i++){
    var r=rows[i]||[], map={}, cnt=0;
    for(var c=0;c<r.length;c++){
      var s=cv(r,c).replace(/\s/g,'');
      var m=s.match(/^周\s*([一二三四五六日天])$/);
      if(m){ map[c]=DAYMAP[m[1]]; cnt++; }
    }
    if(cnt>=3) return {row:i,map:map};
  }
  return null;
}
function mapCols(hdrRow){
  var m={};
  for(var c=0;c<hdrRow.length;c++){
    var s=cv(hdrRow,c).replace(/\s/g,''); if(!s) continue;
    if(/课程编号/.test(s)&&m.code==null) m.code=c;
    else if(/课程名称|课程名/.test(s)&&m.name==null) m.name=c;
    else if(/教师|主讲|任课/.test(s)&&m.teacher==null) m.teacher=c;
    else if(/学时/.test(s)&&m.hours==null) m.hours=c;
    else if(/学分/.test(s)&&m.credit==null) m.credit=c;
    else if(/^时间$|^上课时间$|时段|节次/.test(s)&&m.period==null) m.period=c;
    else if(/备注|说明/.test(s)&&m.note==null) m.note=c;
    else if(/地点|教室/.test(s)&&m.room==null) m.room=c;
  }
  return m;
}
function weekInfo(note){
  var s=String(note||'');
  var m=s.match(/第?\s*(\d{1,2})\s*[-~至—]\s*(\d{1,2})\s*周/);
  if(m){ var a=+m[1],b=+m[2]; if(a>b){var t=a;a=b;b=t;} return {k:'range',a:a,b:b,label:a+'-'+b+'周'}; }
  var d=s.match(/(\d{1,2})\s*月\s*(\d{1,2})\s*日开课/);
  if(d){
    try{
      var st=new Date(SEM_START+'T00:00:00');
      var dd=new Date(st.getFullYear()+'-'+pd(d[1])+'-'+pd(d[2])+'T00:00:00');
      var w=Math.floor((dd-st)/604800000)+1; if(w<1) w=1;
      return {k:'range',a:w,b:TOTAL_WEEKS,label:w+'-'+TOTAL_WEEKS+'周'};
    }catch(e){}
  }
  if(/单周/.test(s)) return {k:'odd',a:1,b:17,label:'单周'};
  if(/双周/.test(s)) return {k:'even',a:2,b:18,label:'双周'};
  return {k:'range',a:1,b:TOTAL_WEEKS,label:'1-'+TOTAL_WEEKS+'周'};
}
function weeksArr(w){
  var r=[],i;
  if(w.k==='odd'){ for(i=1;i<=17;i+=2) r.push(i); }
  else if(w.k==='even'){ for(i=2;i<=18;i+=2) r.push(i); }
  else { for(i=w.a;i<=w.b;i++) r.push(i); }
  return r;
}
function roomOf(v){ v=String(v||'').replace(/\n/g,' ').replace(/\s+/g,''); var a=v.split('/'); return a.length>1?a[a.length-1]:v; }
function parseRows(rows){
  var hi=findHeader(rows); if(hi<0) return null;
  var cols=mapCols(rows[hi]), dr=findDayRow(rows,hi);
  if(cols.name==null) return null;
  var out=[],seq=0;
  for(var i=hi+1;i<rows.length;i++){
    var r=rows[i]||[];
    var name=cv(r,cols.name);
    if(!name||name.length<2) continue;
    if(/上课时间|校区|星期|合计|说明|备注/.test(name)) continue;
    if(/^\d+$/.test(name)) continue;
    if(name.length>40) continue;
    if(/[上下晚]午/.test(name) && /\d/.test(name)) continue;
    var note=cv(r,cols.note), per=cv(r,cols.period).replace(/\s/g,'');
    var hours=parseInt(cv(r,cols.hours),10); if(!hours) hours=16;
    var wk=weekInfo(note);
    var nt=note.match(/(\d{1,2})\s*[:：]\s*(\d{2})\s*[-~至—]\s*(\d{1,2})\s*[:：]\s*(\d{2})/);
    var rs=nt?(pd(nt[1])+':'+nt[2]):'', re=nt?(pd(nt[3])+':'+nt[4]):'';
    var times=[], rooms=[];
    if(dr){
      for(var key in dr.map){
        var c=key|0, v=cv(r,c); if(!v) continue;
        var st='08:30', en='11:30';
        if(rs){ st=rs; en=re; }
        else if(PM[per]){ st=PM[per][0]; en=PM[per][1]; }
        times.push({d:dr.map[key],start:st,end:en,weeks:weeksArr(wk),wk:wk.label});
        rooms.push(DAYLBL[dr.map[key]]+' '+roomOf(v));
      }
    } else if(PM[per]){
      times.push({d:0,start:PM[per][0],end:PM[per][1],weeks:weeksArr(wk),wk:wk.label});
    }
    seq++;
    out.push({ id:'x'+seq, code:cv(r,cols.code), name:name, teacher:cv(r,cols.teacher)||'—',
      hours:hours, credit:+(hours/16).toFixed(1), cat:'', admin:'', note:note.slice(0,60),
      status:'候选', room:rooms.join('；'), times:times });
  }
  return out.length?out:null;
}

/* ============ 文件选择 ============ */
function pickFile(cb){
  if(typeof XLSX==='undefined'){ toast('Excel 解析组件未加载'); return; }
  var inp=document.createElement('input');
  inp.type='file'; inp.accept='.xlsx,.xls,.csv'; inp.style.display='none';
  document.body.appendChild(inp);
  inp.onchange=function(){
    var f=inp.files&&inp.files[0];
    if(!f){ try{document.body.removeChild(inp);}catch(e){} return; }
    var fr=new FileReader();
    fr.onload=function(e){
      try{
        var wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
        cb(wb,f.name);
      }catch(err){ toast('解析失败：'+err.message); }
      try{document.body.removeChild(inp);}catch(er){}
    };
    fr.onerror=function(){ toast('读取文件失败'); try{document.body.removeChild(inp);}catch(er){} };
    fr.readAsArrayBuffer(f);
  };
  inp.click();
}
function rowsOf(wb,idx){
  var ws=wb.Sheets[wb.SheetNames[idx]];
  return XLSX.utils.sheet_to_json(ws,{header:1,defval:'',blankrows:false,raw:false});
}
function readTable(wb){
  for(var i=0;i<wb.SheetNames.length;i++){
    var rows=rowsOf(wb,i);
    if(rows.length<2) continue;
    if(findHeader(rows)>=0) return {rows:rows,name:wb.SheetNames[i]};
  }
  return {rows:rowsOf(wb,0),name:wb.SheetNames[0]};
}

/* ============ 导入预览 ============ */
var _importList=null;
function showPreview(list,sheet,file){
  _importList=list;
  var h='<h2>导入预览</h2><div class="desc">来源：'+esc(file)+' · 工作表「'+esc(sheet)+'」<br>'+
    '共识别 <b>'+list.length+'</b> 门课程。勾选你<b>已选 / 要选</b>的课程，可将它们写入学期课表。</div>';
  h+='<div style="max-height:44vh;overflow:auto;border:1px solid var(--line);border-radius:8px">';
  h+='<table class="tb"><thead><tr><th style="width:30px">选</th><th>课程</th><th>上课时间</th><th>教室</th></tr></thead><tbody>';
  for(var i=0;i<list.length;i++){
    var c=list[i];
    var t=c.times.length?c.times.map(function(x){return DAYLBL[x.d]+' '+x.start+'-'+x.end+' '+x.wk}).join('；'):'待定';
    h+='<tr><td><input type="checkbox" class="pk" data-i="'+i+'"></td><td><b>'+esc(c.name)+
       '</b><div style="font-size:10.5px;color:var(--tx3)">'+esc(c.teacher)+' · '+c.hours+'学时</div></td>'+
       '<td style="font-size:10.5px">'+esc(t)+'</td><td style="font-size:10.5px">'+esc(c.room||'—')+'</td></tr>';
  }
  h+='</tbody></table></div>';
  h+='<div class="sec">导入方式</div>';
  h+='<div style="font-size:12px;color:var(--tx2);margin-bottom:12px">「仅选课清单」把全部课程放进选课模式做冲突分析；「+ 我的课表」同时把勾选课程写入学期课表。</div>';
  h+='<div class="foot"><button class="btn" onclick="closeM()">取消</button>'+
     '<button class="btn" id="impPlan">仅更新选课清单</button>'+
     '<button class="btn pri" id="impBoth">导入 + 写入我的课表</button></div>';
  open(h);
  document.getElementById('impPlan').onclick=function(){ doImport(false); };
  document.getElementById('impBoth').onclick=function(){ doImport(true); };
}
function picked(){
  var ns=document.querySelectorAll('#modal .pk'), a=[];
  for(var i=0;i<ns.length;i++) if(ns[i].checked) a.push(+ns[i].getAttribute('data-i'));
  return a;
}
function doImport(alsoTerm){
  var list=_importList; if(!list) return;
  var picks=picked();
  planCourses.length=0;
  for(var i=0;i<list.length;i++){ list[i].id='p'+(i+1); list[i].status='候选'; planCourses.push(list[i]); }
  var dropped=0;
  if(alsoTerm){
    if(!picks.length){ toast('请先勾选要写入课表的课程'); return; }
    courses.length=0; slots.length=0;
    for(var k=0;k<picks.length;k++){
      var c=list[picks[k]], cid='c'+(k+1);
      courses.push({id:cid,name:c.name,code:c.code,teacher:c.teacher,credit:c.credit,cat:'',color:k%8});
      for(var j=0;j<c.times.length;j++){
        var t=c.times[j];
        slots.push({id:'s'+(k+1)+'_'+j,c:cid,d:t.d,p:perOf(t.start),b:'',r:c.room||'',w:t.wk,weeks:t.weeks,mode:'线下'});
      }
      c.status='已选';
    }
    var ids={}; for(var m=0;m<courses.length;m++) ids[courses[m].id]=1;
    var keep=[];
    for(var n=0;n<assigns.length;n++){ if(ids[assigns[n].c]) keep.push(assigns[n]); else dropped++; }
    assigns=keep;
  }
  closeM();
  if(alsoTerm){ setMode('term'); } else { setMode('plan'); }
  render();
  toast('已导入 '+list.length+' 门课程'+(alsoTerm?('，写入课表 '+picks.length+' 门'+(dropped?'，移除 '+dropped+' 条失效作业':'')):''));
}
function importExcel(){
  pickFile(function(wb,fn){
    var t=readTable(wb);
    var list=parseRows(t.rows);
    if(!list){ toast('未识别到课程表结构（需含「课程名称」表头）'); return; }
    showPreview(list,t.name,fn);
  });
}
function importPlanFile(){
  var h='<h2>导入选课清单</h2><div class="desc">可以导入教务的完整选课列表（Excel），或粘贴文本清单。</div>';
  h+='<div class="foot"><button class="btn" onclick="closeM()">取消</button>'+
     '<button class="btn" id="plTxt">粘贴文本清单</button>'+
     '<button class="btn pri" id="plFile">从 Excel 文件导入</button></div>';
  open(h);
  document.getElementById('plTxt').onclick=function(){ closeM(); openPlanImport(); };
  document.getElementById('plFile').onclick=function(){ importExcel(); };
}

/* ============ 更多菜单（备份 / 恢复） ============ */
function openMore(){
  var h='<h2>数据管理</h2><div class="desc">数据保存在本机 App 内。建议定期导出备份。</div>';
  h+='<div class="sec">当前状态</div><div class="kv">'+
     '<div class="k">课程</div><div>'+courses.length+' 门</div>'+
     '<div class="k">排课</div><div>'+slots.length+' 条</div>'+
     '<div class="k">作业</div><div>'+assigns.length+' 条</div>'+
     '<div class="k">学习计划</div><div>'+plans.length+' 条</div>'+
     '<div class="k">选课清单</div><div>'+planCourses.length+' 门</div></div>';
  h+='<div class="sec">操作</div>';
  h+='<div style="display:flex;flex-direction:column;gap:8px">'+
     '<button class="btn" id="mExp">导出备份（JSON）</button>'+
     '<button class="btn" id="mReset">清除本地数据，恢复内置示例</button></div>';
  h+='<div class="foot"><button class="btn pri" onclick="closeM()">关闭</button></div>';
  open(h);
  document.getElementById('mExp').onclick=function(){
    var data={courses:courses,slots:slots,events:events,assigns:assigns,changes:changes,planCourses:planCourses,plans:plans,W:W};
    var txt=JSON.stringify(data);
    if(window.Android&&window.Android.saveFile){ window.Android.saveFile('课表备份.json',txt); }
    else { try{ localStorage.setItem('gs_backup',txt); toast('已保存到 App 内部备份区'); }catch(e){ toast('导出失败'); } }
    closeM();
  };
  document.getElementById('mReset').onclick=function(){
    nsClear();
    closeM(); location.reload();
  };
}

/* ============ 绑定 ============ */
var be=document.getElementById('btnExcel'); if(be) be.onclick=importExcel;
var bp=document.getElementById('btnPlanImp'); if(bp) bp.onclick=importPlanFile;
var more=document.createElement('button');
more.className='appmore btn'; more.textContent='☰ 数据'; more.style.boxShadow='0 3px 12px rgba(0,0,0,.18)';
more.onclick=openMore; document.body.appendChild(more);

/* 暴露给自动化测试 / 调试 */
window.__pk={parseRows:parseRows,findHeader:findHeader,findDayRow:findDayRow,mapCols:mapCols,
  weekInfo:weekInfo,weeksArr:weeksArr,readTable:readTable,importExcel:importExcel,openMore:openMore};

try{ persist(); }catch(e){}
if(_had){ try{ render(); }catch(e){} }
setTimeout(function(){ try{ toast('已载入本地数据'); }catch(e){} },600);
})();
</script>
